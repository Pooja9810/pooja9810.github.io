<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#1a535c"/>
  <g fill="none" stroke-linecap="round" transform="translate(0 -1.5)">
    <!-- first P -->
    <circle cx="26" cy="26" r="11" stroke="#4ecdc4" stroke-width="3.4"/>
    <path d="M15 26V52" stroke="#4ecdc4" stroke-width="3.4"/>
    <!-- second P, passing over the first at the top -->
    <g stroke="#1a535c" stroke-width="7">
      <circle cx="38" cy="26" r="11"/>
      <path d="M27 26V52"/>
    </g>
    <g stroke="#f7fff7" stroke-width="3.4">
      <circle cx="38" cy="26" r="11"/>
      <path d="M27 26V52"/>
    </g>
    <!-- first P passes back over the second at the bottom, so they interlock -->
    <path d="M34.43 33.07A11 11 0 0 1 25.04 36.96" stroke="#1a535c" stroke-width="7" stroke-linecap="butt"/>
    <path d="M34.43 33.07A11 11 0 0 1 25.04 36.96" stroke="#4ecdc4" stroke-width="3.4" stroke-linecap="butt"/>
  </g>
</svg>
